name: Android Integration Tests
# Runs Android emulator for integration testing
# Samsung Galaxy S23 device profile

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  android-test:
    name: Device Integration Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
      AVD_NAME: Galaxy_S23_Test
      API_LEVEL: 34
      DISPLAY: ':99'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate runner capabilities
        run: |
          echo "CPU cores: $(nproc)"
          echo "RAM: $(free -h | awk '/Mem:/{print $2}')"
          echo "KVM available: $([ -e /dev/kvm ] && echo yes || echo no)"
          egrep -c '(vmx|svm)' /proc/cpuinfo && echo "Hardware virt: yes" || true

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm || true

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xvfb \
            x11vnc \
            novnc \
            websockify \
            python3 \
            python3-pip \
            openjdk-17-jdk-headless \
            wget \
            unzip \
            curl \
            libpulse0 \
            libnss3 \
            libxcursor1 \
            libxrandr2 \
            libxss1 \
            libxinerama1 \
            libxfixes3 \
            libxi6 \
            libxtst6 \
            nginx \
            openssl \
            ca-certificates \
            socat \
            jq 2>/dev/null
          pip3 install aiohttp --quiet

      - name: Setup Java environment
        run: |
          export JAVA_HOME=$(readlink -f /usr/bin/java | sed 's|/bin/java||')
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "PATH=$JAVA_HOME/bin:$PATH" >> "$GITHUB_ENV"

      - name: Download Android command-line tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-unzip
          mv /tmp/cmdline-unzip/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          rm -f /tmp/cmdline-tools.zip
          echo "PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH" \
            >> "$GITHUB_ENV"

      - name: Accept SDK licenses and install packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager --install \
            "platform-tools" \
            "emulator" \
            "platforms;android-${API_LEVEL}" \
            "system-images;android-${API_LEVEL};google_apis;x86_64" \
            2>&1 | tail -5

      - name: Create Galaxy S23 AVD
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"

          echo "no" | avdmanager create avd \
            --name "$AVD_NAME" \
            --package "system-images;android-${API_LEVEL};google_apis;x86_64" \
            --device "pixel_6" \
            --force 2>&1

          # S23 hardware config: 8GB RAM, 4 cores, 1080x2340 @ 425 dpi, 120Hz
          AVD_DIR="$HOME/.android/avd/${AVD_NAME}.avd"
          cat >> "$AVD_DIR/config.ini"
